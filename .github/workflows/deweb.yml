name: DeWeb deployer

on:
  push:
    branches:
      - main
    # Skip pushes that only touch CI or repo metadata, the website is unchanged.
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

# Never run two uploads in parallel: a push while a deploy is running waits for it,
# and a newer push replaces the pending one, so only main HEAD gets deployed.
concurrency:
  group: deweb-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DeWeb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        env:
          VITE_PLAUSIBLE_API_HOST: ${{ secrets.PLAUSIBLE_API_HOST }}
        run: npm run build

      - name: Deploy to Massa DeWeb
        id: deploy
        uses: massalabs/deweb-gh-action@v0.1.2
        with:
          config_file: deweb_cli_config.mainnet.json
          source_folder: ./dist
        env:
          MASSA_DEWEB_SECRET_KEY: ${{ secrets.MASSA_DEWEB_MAINNET_PKEY }}

      - name: Get deployed website address
        run: |
          echo "Deployed website address: ${{ steps.deploy.outputs.deployed-website }}"
